<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio com Tags</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <p>Em HTML5, podemos inserir os termos da lista a seguir. <br> Passe  mouse por cima dos termos para descobrir qual tag usar em cada caso.</p>
    <ul type="square">
        <li> <abbr title="Use a tag <p>">Parágrafo</abbr></li>
        <li><abbr title="Use as tags <h1>,<h2>...">Títulos</abbr></li>
        <li><abbr title="Use a tag <img>">Imagens</abbr></li>
        <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
         <li><abbr title="Use a tag <ol>">Listas númeradas</abbr></li>   
    </ul>
    
        
    
</body>
</html>
