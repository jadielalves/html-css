<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>

    <style>
        @font-face {
            font-family: 'Perfect';
            src: url('fontes/KGPerfectPenmanship.otf'); format('opentype')
            url('fontes/KGPerfectPenmanship.ttf') format('truetype')
            font-weight: normal;
            font-style: normal;

            /*
            Tipos de format()
            -opentype (otf)
            -truetype (ttf)
            -embedded-opentype
            -truetype-aap (Apple Advanced Typography)
            -svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'Perfect', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Laboriosam, temporibus debitis? Ducimus veniam culpa beatae obcaecati nulla. In nemo nulla, assumenda accusamus nihil repellendus, necessitatibus quae reiciendis ea iste molestias.</p>
</body>
</html>
