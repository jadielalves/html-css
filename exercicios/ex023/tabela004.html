<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
        }

        tr, th, td{
            border: 1px solid black;
            padding: 10px;
        
        }

        tr, th{
            text-align: center;
        }

        td{
            white-space: nowrap;
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Grupos</th>
            <th colspan="">Nomes</th>
            <th>Filmes</th>
        </tr>

        <tr>
            <th>Mulheres</th>
            <td colspan="4"> Ana Maria Santos</td>
            <td>Alien</td>
            <td>Rambo</td>
            <td>Vingadores</td>
        </tr>

        <tr>
            <th>Homens</th>
        </tr>
    </table>
</body>
</html>
