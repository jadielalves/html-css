<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
     <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <label for="icor">Cor</label>
            <input type="color" name="cor" id="icor" value="#00ff00"> <br>

            <label for="inivel">Nivel de Satisfação</label>
            <input type="range" name="nivel" id="inivel" min="1" max="5" value="5"> <br>

            <label for="ifile">Foto de Perfil:</label>
            <input type="file" name="file" id="ifile">
        </fieldset>

        <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
     </form>
</body>
</html>
